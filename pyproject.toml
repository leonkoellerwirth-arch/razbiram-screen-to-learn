[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "razbiram-screen-to-learn"
version = "0.0.1"
description = "Turn learning screens into reviewable, evidence-backed razbiram learncards."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "jsonschema>=4.22",
  "httpx>=0.27",
]

[project.scripts]
razbiram-screen-to-learn = "razbiram_screen_to_learn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/razbiram_screen_to_learn"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001/2/3 flag characters that look like another script's. In these files that is the
# subject matter, not a mistake: OCR returns Cyrillic А/В/С for Latin A/B/C, and binding an answer
# key across that split is exactly what they implement. The rule stays on everywhere else.
"src/razbiram_screen_to_learn/ocr.py" = ["RUF001", "RUF002", "RUF003"]
"src/razbiram_screen_to_learn/quality.py" = ["RUF001", "RUF002", "RUF003"]
"src/razbiram_screen_to_learn/textcards.py" = ["RUF001", "RUF002", "RUF003"]
"src/razbiram_screen_to_learn/textseg.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_textpath.py" = ["RUF001", "RUF002", "RUF003"]
# Same reason: these fixtures reproduce real OCR output, ambiguous glyphs and all.
"tests/test_screenshot.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_quality.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: needs network, a real model, or a browser; excluded from the gate and CI",
]
