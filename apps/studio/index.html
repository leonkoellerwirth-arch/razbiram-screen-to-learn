    <!--
      Adopted from razbiram-anki's shell with one deliberate difference: that app loads the
      razbiram typefaces from Google Fonts, and this one does not. The studio is local-first and
      handles captured learning content, so a page load must stay offline — a webfont request
      would send the user's IP to a third party on every launch and would break offline Golden
      runs. styles.css keeps the same font stack and falls back to system faces until the faces
      are vendored locally. Tracked as a follow-up in docs/planning/EXECUTION_PLAN.md.
      The razbiram visual identity remains © razbiram.com — see styles.css.
    -->
